<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - IRIS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #F6EC9F 0%, #98D6A5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 420px;
      padding: 50px 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo-container img {
      height: 50px;
      width: auto;
      max-width: 200px;
    }

    .login-header h1 {
      font-size: 48px;
      font-weight: 700;
      color: #004e89;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .login-header p {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #004e89;
      box-shadow: 0 0 0 3px rgba(0, 78, 137, 0.1);
    }

    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      border: 1px solid #ef5350;
    }

    button {
      width: 100%;
      padding: 14px 16px;
      background: #004e89;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
    }

    button:hover {
      background: #003f6b;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 78, 137, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }

    .accent-bar {
      height: 4px;
      background: linear-gradient(90deg, #004e89 0%, #98D6A5 100%);
      border-radius: 2px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="logo-container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="IRIS Logo">
      </div>
      <h1>IRIS</h1>
      <p>Integrated Retrieval<br>Intelligent System</p>
    </div>

    <div class="accent-bar"></div>

    {% if error %}
    <div class="error-message">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Enter your username" 
          required 
          autofocus
          value="{{ username|default('') }}"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password" 
          required
        />
      </div>

      <button type="submit">Login</button>
    </form>

    <div class="footer">
      <p>© 2026 IRIS - Integrated Retrieval Intelligent System</p>
    </div>
  </div>
</body>
</html>
